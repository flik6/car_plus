name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '(^e: |^w: | error: |FAILURE:|What went wrong:)' gradle-build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$rc"

      - name: Copy APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk CarPlus-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarPlus-debug-apk
          path: CarPlus-debug.apk

      - name: Publish public APK release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view carplus-latest >/dev/null 2>&1; then
            gh release upload carplus-latest CarPlus-debug.apk --clobber
          else
            gh release create carplus-latest CarPlus-debug.apk \
              --title "CarPlus debug APK (latest main)" \
              --notes "Built from ${GITHUB_SHA} by workflow run ${GITHUB_RUN_ID}" \
              --latest
          fi
