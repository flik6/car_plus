name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '(^e: |^w: | error: |FAILURE:|What went wrong:)' gradle-build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$rc"

      - name: Copy APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk CarPlus-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarPlus-debug-apk
          path: CarPlus-debug.apk

      - name: Extract version metadata
        id: meta
        shell: bash
        run: |
          VCODE=$(python3 -c '
          import os, re
          txt = open("app/build.gradle", encoding="utf-8").read()
          run_num = int(os.environ.get("GITHUB_RUN_NUMBER") or "1")
          m = re.search(r"\bversionCode\s+([^\r\n]+)", txt)
          val = ""
          if m:
              expr = m.group(1).strip().replace("ciRunNumber", str(run_num))
              if re.fullmatch(r"[0-9+\-*/ ()]+", expr):
                  val = str(int(eval(expr)))
              else:
                  d = re.search(r"\d+", expr)
                  val = d.group(0) if d else ""
          print(val or "1")
          ')
          VNAME=$(python3 -c '
          import os, re
          txt = open("app/build.gradle", encoding="utf-8").read()
          run_num = os.environ.get("GITHUB_RUN_NUMBER") or "1"
          m = re.search(r"\bversionName\s+[\"\x27]([^\"\x27]+)[\"\x27]", txt)
          val = m.group(1).replace("${ciRunNumber}", run_num).replace("$ciRunNumber", run_num) if m else "1.0.0"
          print(val)
          ')
          echo "vcode=${VCODE}" >> "$GITHUB_OUTPUT"
          echo "vname=${VNAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared metadata: CarPlus v${VNAME} (Build ${VCODE})"

      - name: Publish CarPlus-debug.apk to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VNAME: ${{ steps.meta.outputs.vname }}
          VCODE: ${{ steps.meta.outputs.vcode }}
        run: |
          python3 - << 'PYEOF'
          import json, os, sys, time, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          vname = os.environ["VNAME"]
          vcode = os.environ["VCODE"]
          title = f"CarPlus v{vname} (Build {vcode})"
          body = f"versionName={vname} versionCode={vcode} commit={sha}"

          def api(method, url, data=None, content_type="application/json"):
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "carplus-ci",
              }
              if data is not None:
                  if isinstance(data, (dict, list)):
                      data = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          raw = resp.read().decode("utf-8", errors="replace")
                          return resp.status, (json.loads(raw) if raw.strip() else {})
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8", errors="replace")[:300]
                      if e.code >= 500 and attempt < 2:
                          time.sleep(3)
                          continue
                      return e.code, {"error": err_body}
                  except Exception as e:
                      if attempt < 2:
                          time.sleep(3)
                          continue
                      return 0, {"error": str(e)}

          def fail(step, code, payload):
              msg = f"{step} failed: HTTP {code} {str(payload)[:240]}"
              print(f"::error::{msg}")
              sys.exit(1)

          apk_bytes = open("CarPlus-debug.apk", "rb").read()

          def upload_apk(rid):
              c, r = api("GET", f"https://api.github.com/repos/{repo}/releases/{rid}/assets")
              if c == 200 and isinstance(r, list):
                  for asset in r:
                      if asset.get("name") == "CarPlus-debug.apk":
                          dc, dr = api("DELETE", f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}")
                          if dc not in (200, 204):
                              fail("delete_asset", dc, dr)
              u = f"https://uploads.github.com/repos/{repo}/releases/{rid}/assets?name=CarPlus-debug.apk"
              uc, ur = api("POST", u, data=apk_bytes, content_type="application/vnd.android.package-archive")
              if uc not in (200, 201):
                  fail("upload_asset", uc, ur)
              print(f"Uploaded CarPlus-debug.apk to release {rid} ({len(apk_bytes)} B, HTTP {uc})")

          # 1. Ensure git tag 'latest' points to current SHA
          code, res = api("PATCH", f"https://api.github.com/repos/{repo}/git/refs/tags/latest", {"sha": sha, "force": True})
          if code in (404, 422):
              code, res = api("POST", f"https://api.github.com/repos/{repo}/git/refs", {"ref": "refs/tags/latest", "sha": sha})
          if code not in (200, 201):
              fail("update_tag", code, res)
          print(f"Tag latest -> {sha[:7]} (HTTP {code})")

          # 2. Get or create 'latest' release & upload APK
          code, rel = api("GET", f"https://api.github.com/repos/{repo}/releases/tags/latest")
          if code == 404:
              code, rel = api("POST", f"https://api.github.com/repos/{repo}/releases", {
                  "tag_name": "latest",
                  "target_commitish": sha,
                  "name": title,
                  "body": body,
                  "draft": False,
                  "prerelease": False,
                  "make_latest": "true",
              })
              if code not in (200, 201):
                  fail("create_release", code, rel)
              upload_apk(rel["id"])
          elif code == 200:
              rel_id = rel["id"]
              upload_apk(rel_id)
              # 3. Try updating 'latest' release metadata; if GitHub returns 500 on this release ID,
              #    also publish a clean versioned release with make_latest=true so /releases/latest updates.
              pcode, pupd = api("PATCH", f"https://api.github.com/repos/{repo}/releases/{rel_id}", {
                  "tag_name": "latest",
                  "name": title,
                  "body": body,
                  "make_latest": "true",
              })
              if pcode == 200:
                  print(f"Updated release {rel_id} metadata: {title}")
              else:
                  print(f"::warning::PATCH latest release {rel_id} returned HTTP {pcode}; publishing versioned make_latest release")
                  vtag = f"v{vname}-b{vcode}"
                  ccode, crel = api("POST", f"https://api.github.com/repos/{repo}/releases", {
                      "tag_name": vtag,
                      "target_commitish": sha,
                      "name": title,
                      "body": body,
                      "draft": False,
                      "prerelease": False,
                      "make_latest": "true",
                  })
                  if ccode not in (200, 201):
                      fail("create_versioned_release", ccode, crel)
                  upload_apk(crel["id"])
                  print(f"Published versioned latest release {vtag} (id={crel['id']})")
          else:
              fail("get_release", code, rel)
          PYEOF
