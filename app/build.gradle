plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.chery.carplus"
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file("carplus-debug.jks")
            storePassword "carplus123"
            keyAlias "carplusdebug"
            keyPassword "carplus123"
        }
    }

    defaultConfig {
        def ciRunNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
        applicationId "com.chery.carplus"
        minSdk 23
        targetSdk 34
        versionCode 100 + ciRunNumber
        versionName "2.9.8"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
}
